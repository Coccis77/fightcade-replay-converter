name: cli
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
# Least privilege: only the release job writes (the GitHub release), only the image job publishes.
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: build/fc2mp4.exe
            name: fc2mp4-cli.exe
          - os: macos-latest
            artifact: build/fc2mp4
            name: fc2mp4-macos-arm64
          - os: ubuntu-latest
            artifact: build/fc2mp4
            name: fc2mp4-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Unit tests (macOS paths)
        if: runner.os != 'Windows'
        run: npm test
      - name: Real Windows named-pipe test
        if: runner.os == 'Windows'
        run: npx vitest run tests/transport.test.ts -t pipeTransport
      - name: Stopping on stdin close, and exiting while stdin stays open (Windows pipes)
        if: runner.os == 'Windows'
        run: npx vitest run tests/signals.test.ts
      - run: npm run bundle
      - run: npm run sea
      - name: Smoke test
        shell: bash
        run: ./${{ matrix.artifact }} --help | head -1
      - shell: bash
        run: cp ${{ matrix.artifact }} ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
  ui:
    # The .NET Framework window builds anywhere from reference assemblies; Linux is the cheapest runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test ui/tests/Fc2mp4Ui.Tests.csproj
      - run: dotnet build ui/src/Fc2mp4Ui.csproj -c Release -p:Version="$(node -p "require('./package.json').version")"
      - run: cp ui/src/bin/Release/net48/fc2mp4.exe fc2mp4.exe
      - uses: actions/upload-artifact@v4
        with:
          name: fc2mp4-window
          path: fc2mp4.exe
  installer:
    needs: [build, ui]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fc2mp4-cli.exe
          path: build/installer
      - uses: actions/download-artifact@v4
        with:
          name: fc2mp4-window
          path: build/installer
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version 6.7.1 -y --no-progress } # pinned: the path above is Inno Setup 6's
          $version = node -p "require('./package.json').version"
          & $iscc "/DAppVersion=$version" installer\fc2mp4.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install, update and uninstall it
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $app = "$env:LOCALAPPDATA\Programs\fc2mp4"
          $silent = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/nolaunch=1'
          Start-Process build\fc2mp4-setup.exe -ArgumentList $silent -Wait
          if (-not (Test-Path "$app\fc2mp4.exe") -or -not (Test-Path "$app\fc2mp4-cli.exe")) { throw 'files missing after install' }
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\fc2mp4.lnk"
          if (-not (Test-Path $shortcut)) { throw 'no Start-menu shortcut after install' }
          $printed = (& "$app\fc2mp4-cli.exe" --version | Out-String).Trim()
          if ($printed -ne $version) { throw "fc2mp4-cli.exe --version printed '$printed', expected $version" }
          Start-Process build\fc2mp4-setup.exe -ArgumentList $silent -Wait
          if (-not (Test-Path "$app\fc2mp4-cli.exe")) { throw 'files missing after update' }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $app) { throw 'program folder still there after uninstall' }
          if (Test-Path $shortcut) { throw 'Start-menu shortcut still there after uninstall' }
      - uses: actions/upload-artifact@v4
        with:
          name: fc2mp4-setup.exe
          path: build/fc2mp4-setup.exe
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fc2mp4-linux-x64
      - name: Build image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker build --secret id=gh,env=GITHUB_TOKEN -t fc2mp4:test .
      - name: Check image
        run: bash scripts/check-image.sh fc2mp4:test "$(node -p "require('./package.json').version")"
      - name: Publish to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${GITHUB_REF_NAME#v}"
          tags="$version"
          # A pre-release (v1.0.0-rc1) never becomes :latest.
          case "$version" in *-*) ;; *) tags="$tags latest" ;; esac
          for tag in $tags; do
            docker tag fc2mp4:test "ghcr.io/coccis77/fc2mp4:$tag"
            docker push "ghcr.io/coccis77/fc2mp4:$tag"
          done
  release:
    needs: [build, image, ui, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: fc2mp4-docker for this release (pulls this release's image)
        run: sed "s/__FC2MP4_VERSION__/${GITHUB_REF_NAME#v}/" scripts/fc2mp4-docker > fc2mp4-docker && chmod +x fc2mp4-docker
      - run: |
          # A pre-release (v1.0.0-rc1) is marked as such, so it never shows as the "Latest" release.
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "${GITHUB_REF_NAME}" fc2mp4-setup.exe fc2mp4-cli.exe fc2mp4-macos-arm64 fc2mp4-linux-x64 fc2mp4-docker $pre \
            --repo "${GITHUB_REPOSITORY}" --title "fc2mp4 ${GITHUB_REF_NAME}" \
            --notes "Windows: download fc2mp4-setup.exe and run it (it updates itself afterwards). Command line: fc2mp4-cli.exe. macOS: fc2mp4-macos-arm64. Linux: fc2mp4-linux-x64, or fc2mp4-docker (runs the Docker image ghcr.io/coccis77/fc2mp4:${GITHUB_REF_NAME#v} with the same arguments; see README). Unsigned: Windows SmartScreen may ask you to confirm (More info → Run anyway)."
