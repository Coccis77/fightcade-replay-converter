name: cli
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
# Least privilege: only the release job writes (the GitHub release), only the image job publishes.
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: build/fc2mp4.exe
            name: fc2mp4.exe
          - os: macos-latest
            artifact: build/fc2mp4
            name: fc2mp4-macos-arm64
          - os: ubuntu-latest
            artifact: build/fc2mp4
            name: fc2mp4-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Unit tests (macOS paths)
        if: runner.os != 'Windows'
        run: npm test
      - name: Real Windows named-pipe test
        if: runner.os == 'Windows'
        run: npx vitest run tests/transport.test.ts -t pipeTransport
      - run: npm run bundle
      - run: npm run sea
      - name: Smoke test
        shell: bash
        run: ./${{ matrix.artifact }} --help | head -1
      - shell: bash
        run: cp ${{ matrix.artifact }} ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fc2mp4-linux-x64
      - name: Build image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker build --secret id=gh,env=GITHUB_TOKEN -t fc2mp4:test .
      - name: Check image
        run: bash scripts/check-image.sh fc2mp4:test "$(node -p "require('./package.json').version")"
      - name: Publish to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${GITHUB_REF_NAME#v}"
          tags="$version"
          # A pre-release (v1.0.0-rc1) never becomes :latest.
          case "$version" in *-*) ;; *) tags="$tags latest" ;; esac
          for tag in $tags; do
            docker tag fc2mp4:test "ghcr.io/coccis77/fc2mp4:$tag"
            docker push "ghcr.io/coccis77/fc2mp4:$tag"
          done
  release:
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: |
          gh release create "${GITHUB_REF_NAME}" fc2mp4.exe fc2mp4-macos-arm64 fc2mp4-linux-x64 \
            --repo "${GITHUB_REPOSITORY}" --title "fc2mp4 ${GITHUB_REF_NAME}" \
            --notes "Download fc2mp4.exe (Windows), fc2mp4-macos-arm64 (macOS) or fc2mp4-linux-x64 (Linux), then run it with a Fightcade replay link. Docker: ghcr.io/coccis77/fc2mp4:${GITHUB_REF_NAME#v} (see README). Unsigned: Windows SmartScreen may ask you to confirm (More info → Run anyway)."
